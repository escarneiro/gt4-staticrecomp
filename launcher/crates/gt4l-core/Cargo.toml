[package]
name = "gt4l-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "GT4Recomp launcher core: settings table, config file, paths, launch plan and exit classification"

[features]
# The portable build (TASK-098): everything beside the executable, no registry or system folders, self-update by zip swap.
portable = []
# TASK-074: the Linux AppImage build. A portable build whose `user` and `data` folders live in
# `$XDG_DATA_HOME/GT4Recomp` (else `~/.local/share/GT4Recomp`), since the program files are a read-only image.
appimage = ["portable"]

[dependencies]
toml.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ureq = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
serde_json.workspace = true
